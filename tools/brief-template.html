<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Project Nucleon — a shared INFS3605 working brief, evidence register and meeting guide.">
<title>Project Nucleon · Team brief</title>
<style>
:root{color-scheme:light;--ink:#17302d;--muted:#52645f;--paper:#f4f6f0;--white:#fff;--line:#d8dfd4;--accent:#186756;--soft:#e5efe8;--amber:#88550e;--red:#914a42;--shadow:0 12px 40px #17302d0b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif;font-size:16px;line-height:1.55}button,input,textarea{font:inherit}button,a,input,textarea{outline-offset:4px}button{cursor:pointer}a{color:var(--accent);text-underline-offset:3px}.top{padding:20px 36px 18px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:13px}.monogram{width:39px;height:39px;background:var(--ink);color:var(--white);display:grid;place-items:center;font-size:22px;font-weight:700}.brand strong{display:block;font-size:19px;letter-spacing:-.3px}.brand small{display:block;color:var(--muted);font-size:12px}.tools{display:flex;flex-wrap:wrap;gap:8px}.button{border:1px solid var(--line);background:var(--white);color:var(--ink);padding:8px 12px;border-radius:5px;min-height:40px;text-decoration:none;font-size:13px}.button:hover{border-color:var(--accent);background:var(--soft)}.button.primary{background:var(--ink);border-color:var(--ink);color:var(--white)}.shell{max-width:1550px;margin:auto;display:grid;grid-template-columns:225px minmax(0,1fr)}aside{padding:30px 20px 30px 30px;border-right:1px solid var(--line)}.side-label,.eyebrow{text-transform:uppercase;letter-spacing:1.8px;font-size:11px;font-weight:700;color:var(--accent)}.nav{display:flex;flex-direction:column;gap:5px;margin-top:18px}.nav button{border:0;text-align:left;background:none;padding:11px 12px;border-radius:5px;color:var(--muted);font-size:14px;display:flex;gap:12px;align-items:center;min-height:43px}.nav button span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.nav button[aria-current="page"]{background:var(--ink);color:var(--white)}.nav button[aria-current="page"] span{color:#c5d7d0}.side-meta{font-size:12px;color:var(--muted);margin:30px 10px 0}.side-meta strong{color:var(--ink)}main{padding:30px 42px 22px;min-width:0}.search-row{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:26px}.snapshot{font-size:12px;color:var(--muted)}.search-wrap{position:relative;max-width:320px;flex:1}.search-wrap input{width:100%;min-height:40px;border:1px solid var(--line);border-radius:5px;padding:8px 12px;background:var(--white);font-size:13px}.search-results{position:absolute;right:0;left:0;z-index:5;background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow);padding:7px;margin-top:5px}.search-results button{width:100%;text-align:left;background:none;border:0;padding:9px;color:var(--ink);font-size:13px}.search-results button:hover{background:var(--soft)}.search-results p{margin:8px;font-size:13px}.panel[hidden]{display:none}h1{font-size:clamp(29px,3.1vw,46px);line-height:1.12;letter-spacing:-1.25px;max-width:930px;margin:12px 0 19px;font-weight:700}.lead{color:var(--muted);font-size:18px;line-height:1.6;max-width:970px;margin:0 0 28px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:25px 0}.card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:20px;min-width:0}.status{font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:700;display:inline-flex;align-items:center;gap:6px}.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.settled{color:var(--accent)}.proposal{color:var(--amber)}.reported{color:var(--accent)}.open{color:var(--red)}.deferred{color:var(--muted)}.card h2{font-size:19px;line-height:1.25;letter-spacing:-.3px;margin:13px 0 10px}.card p{font-size:14px;line-height:1.65;color:var(--muted);margin:0}.source-tag{margin-top:13px;display:block;font-size:11px;color:var(--muted)}.table-wrap{width:100%;overflow-x:auto;margin:25px 0}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}th{text-align:left;color:var(--muted);font-size:11px;letter-spacing:.7px;text-transform:uppercase;font-weight:700;padding:12px 15px 12px 0;border-bottom:2px solid var(--ink)}td{padding:15px 18px 15px 0;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}td:first-child{font-weight:700;color:var(--ink)}.takeaways{margin:27px 0 15px;padding:0;list-style:none;display:grid;gap:12px}.takeaways li{border-left:3px solid var(--accent);padding:3px 0 3px 17px;max-width:1030px;font-size:14px}.bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:20px 0 0;margin:35px 0 0;gap:10px}.pager{display:flex;gap:8px}.page-count{color:var(--muted);font-size:12px}.footnote{font-size:11px;color:var(--muted);margin-top:12px}.sources{border-top:1px solid var(--line);padding-top:20px;margin-top:30px}.sources summary{cursor:pointer;font-size:13px;font-weight:700}.source-list{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.source-list article{min-width:0;overflow-wrap:anywhere}.source-list h3{font-size:13px;margin:0 0 4px}.source-list p{font-size:12px;line-height:1.6;color:var(--muted);margin:0}.source-list .kind{font-size:10px;text-transform:uppercase;color:var(--amber);letter-spacing:.4px}.diagram{background:var(--white);padding:22px;border:1px solid var(--line);border-radius:8px;margin:22px 0}.diagram-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:15px}.flow-main{display:flex;align-items:center;justify-content:center;gap:18px}.node{border:1px solid var(--line);padding:15px 20px;border-radius:5px;font-size:14px;text-align:center;min-width:180px}.node small{display:block;color:var(--muted);font-size:11px}.node.strong{background:var(--ink);color:var(--white);border-color:var(--ink)}.node.strong small{color:#c5d7d0}.flow-arrow{width:40px;border-top:1px solid var(--accent);position:relative;flex-shrink:0}.flow-arrow::after{content:"";position:absolute;right:0;top:-4px;width:6px;height:6px;border-top:1px solid var(--accent);border-right:1px solid var(--accent);transform:rotate(45deg)}.flow-branches{display:flex;justify-content:center;gap:25px;margin-top:22px}.branch{position:relative}.branch::before{content:"";display:block;height:22px;border-left:1px solid var(--accent);position:absolute;left:50%;top:-22px}.diagram-caption{text-align:center;color:var(--muted);font-size:11px;margin:15px 0 0}.notes{border-top:1px solid var(--line);margin-top:28px;padding-top:22px}.notes h2{font-size:22px;margin:0 0 6px}.notes p{font-size:12px;color:var(--muted)}.note-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin:18px 0}.note-grid label{font-size:12px;font-weight:700;display:block}.note-grid textarea{display:block;width:100%;min-height:150px;margin-top:8px;border:1px solid var(--line);border-radius:5px;padding:12px;font-size:14px;font-weight:400;background:var(--white);color:var(--ink);resize:vertical}.save-state{font-size:11px;color:var(--muted);margin-left:12px}.present aside,.present .search-row,.present .brand small,.present .footnote{display:none}.present .shell{display:block;max-width:1360px}.present main{padding:36px 55px}.present h1{font-size:clamp(36px,4vw,53px)}.present .top{padding:13px 30px}.present .cards p,.present td,.present .takeaways li{font-size:16px}.present .sources{display:none}[hidden]{display:none!important}@media(max-width:1000px){.shell{grid-template-columns:185px minmax(0,1fr)}aside{padding:25px 12px}main{padding:25px}.cards{gap:10px}.card{padding:16px}.card h2{font-size:17px}}@media(max-width:760px){.top{padding:16px;align-items:flex-start;flex-wrap:wrap}.brand small{max-width:165px}.tools{justify-content:flex-end}.button{padding:8px 10px;font-size:12px}.shell{display:block}aside{padding:12px 15px;border-right:0;border-bottom:1px solid var(--line)}.side-label,.side-meta{display:none}.nav{flex-direction:row;flex-wrap:wrap;margin:0;gap:5px}.nav button{font-size:12px;padding:7px 10px;gap:6px;min-height:36px}.nav button span{display:none}main{padding:24px 18px}.search-row{align-items:stretch;flex-direction:column;gap:10px;margin-bottom:22px}.search-wrap{max-width:none}.cards,.note-grid{grid-template-columns:1fr}.card{padding:20px}.card h2{font-size:21px}.lead{font-size:16px}table{font-size:12px}th{font-size:10px}td{padding-right:10px}.source-list{grid-template-columns:1fr}h1{letter-spacing:-.7px}.flow-main{flex-direction:column;gap:15px}.flow-arrow{height:20px;width:0;border-top:0;border-left:1px solid var(--accent)}.flow-arrow::after{top:auto;bottom:0;right:-3px;transform:rotate(135deg)}.flow-branches{gap:10px}.node{min-width:0;padding:12px;font-size:12px}.flow-main .node{width:100%}.flow-branches .node{flex:1}.present main{padding:25px 18px}.present h1{font-size:34px}.present td{font-size:13px}}@media print{body{background:white;color:#111}.top,.search-row,aside,.bottom,.footnote,.tools,.notes .button,.save-state{display:none!important}.shell{display:block}main,.present main{padding:0}.panel[hidden]{display:block!important}.panel{break-before:page;padding:20px 0}.panel:first-child{break-before:auto}.cards{grid-template-columns:repeat(3,1fr)}.card{break-inside:avoid}.lead{font-size:14px}h1,.present h1{font-size:28px}td,.present td{font-size:11px}.sources{display:block!important}.sources>div{display:block}.note-grid textarea{min-height:130px}.note-grid{grid-template-columns:1fr}a{color:#111}.sources{break-before:page}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="monogram" aria-hidden="true">N</div><div><strong>Project Nucleon</strong><small>INFS3605 · Founder’s Second Brain</small></div></div><div class="tools"><button class="button" id="language" type="button">中文</button><button class="button" id="present" type="button">Present</button><button class="button" id="print" type="button">Print / PDF</button><a class="button" href="https://github.com/unitylht/Project-Nucleon" target="_blank" rel="noopener">GitHub</a></div></header>
<div class="shell"><aside><div class="side-label" id="side-label">Team working brief</div><nav class="nav" id="nav" aria-label="Brief sections"></nav><div class="side-meta" id="side-meta"></div></aside><main>
<div class="search-row"><div class="snapshot" id="snapshot"></div><div class="search-wrap"><input id="search" type="search" aria-label="Search this brief" placeholder="Find a topic…" autocomplete="off"><div id="search-results" class="search-results" hidden></div></div></div>
<noscript><style>.panel[hidden]{display:block!important}.nav,.tools,.search-wrap,.bottom{display:none!important}.panel{margin-bottom:55px}</style><p>JavaScript is unavailable. All English sections are shown below. The full bilingual record is also available in the repository.</p></noscript>
<div id="panels">__INITIAL_PANELS__</div>
<details class="sources" id="sources"><summary id="sources-label">Sources & evidence boundaries</summary><div class="source-list" id="source-list"></div></details>
<footer class="bottom"><span class="page-count" id="page-count"></span><div class="pager"><button id="previous" class="button" type="button">Previous</button><button id="next" class="button primary" type="button">Next</button></div></footer><div class="footnote" id="footnote"></div>
</main></div>
<script id="project-data" type="application/json">__PROJECT_DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('project-data').textContent), $=id=>document.getElementById(id);
let lang='en',current=0,notes={scenario:'',removed:'',validation:''};
const NOTE_KEY='nucleon-meeting-2026-10-15-v1';
try{const saved=JSON.parse(localStorage.getItem(NOTE_KEY)||'null');if(saved&&typeof saved==='object'){for(const k of Object.keys(notes))if(typeof saved[k]==='string')notes[k]=saved[k]}}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tr=o=>typeof o==='string'?o:o[lang];
const statusLabel=s=>({settled:{en:'Hanting confirmed',zh:'Hanting 已确认'},proposal:{en:'Proposal',zh:'候选方案'},reported:{en:'Owner account relayed',zh:'老板说法转述'},open:{en:'To verify',zh:'待验证'},deferred:{en:'Deferred',zh:'暂缓'}}[s][lang]);
const text=(en,zh)=>lang==='en'?en:zh;
function diagram(){return `<div class="diagram" role="img" aria-label="${text('Browser connects to one local application; application reads records and calls a language model','浏览器连接本地应用，应用读取记录并调用模型')}"><div class="diagram-label">${text('Candidate architecture · local / home server','候选架构 · 本地／家中服务器')}</div><div class="flow-main"><div class="node">${text('Employee / owner browser','员工／老板浏览器')}<small>${text('Request · evidence · decision','请求 · 证据 · 决定')}</small></div><div class="flow-arrow" aria-hidden="true"></div><div class="node strong">${text('One application backend','一个应用后端')}<small>${text('Calculations · rules · authority · state','计算 · 规则 · 权限 · 状态')}</small></div></div><div class="flow-branches"><div class="node branch">${text('Saved records','持久记录')}<small>${text('Facts · notes · requests · decisions','事实 · 备注 · 请求 · 决定')}</small></div><div class="node branch">${text('Replaceable model interface','可替换模型接口')}<small>${text('Extract · explain · draft','提取 · 解释 · 起草')}</small></div></div><p class="diagram-caption">${text('The browser uses the application. Model credentials stay behind the application. No stack has been selected.','浏览器通过应用操作，模型凭证留在后端。尚未选定具体技术栈。')}</p></div>`}
function notesUI(){return `<section class="notes"><h2>${text('Capture review notes','补充复核记录')}</h2><p>${text('Local notes only. Export and commit reviewed notes to share them. Nothing is sent to GitHub or an AI service.','仅本地笔记。导出并提交审核后的记录才能共享。不会自动发送到 GitHub 或 AI 服务。')}</p><div class="note-grid">${[['scenario','First request scenario','第一个请求场景'],['removed','Owner work removed / new work added','减少的老板工作／新增工作'],['validation','Benefit test + next action / owner / date','价值验证＋下一步／负责人／日期']].map(([id,en,zh])=>`<label>${text(en,zh)}<textarea id="note-${id}" data-note="${id}" placeholder="${text('Record the agreed outcome…','记录约定结果…')}">${esc(notes[id])}</textarea></label>`).join('')}</div><button class="button primary" id="export-notes" type="button">${text('Export meeting notes (.md)','导出会议记录（.md）')}</button><span class="save-state" id="save-state" role="status">${text('Local to this browser','仅在当前浏览器')}</span></section>`}
function render(){
 document.documentElement.lang=lang==='en'?'en':'zh-CN';
 $('nav').innerHTML=D.sections.map((s,i)=>`<button type="button" data-section="${i}" aria-current="${i===current?'page':'false'}"><span>${String(i+1).padStart(2,'0')}</span>${esc(tr(s.nav))}</button>`).join('');
 $('panels').innerHTML=D.sections.map((s,i)=>`<section class="panel" id="${esc(s.id)}" aria-label="${esc(tr(s.nav))}" ${i===current?'':'hidden'}><div class="eyebrow">${esc(tr(s.eyebrow))}</div><h1>${esc(tr(s.title))}</h1><p class="lead">${esc(tr(s.lead))}</p>${s.diagram?diagram():''}${s.cards?`<div class="cards">${s.cards.map(c=>`<article class="card"><div class="status ${esc(c.status)}">${statusLabel(c.status)}</div><h2>${esc(tr(c.title))}</h2><p>${esc(tr(c.body))}</p>${c.source?`<span class="source-tag">${text('Source','来源')}: ${esc(c.source)}</span>`:''}</article>`).join('')}</div>`:''}${s.table?`<div class="table-wrap"><table><thead><tr>${s.table.headers.map(h=>`<th scope="col">${esc(tr(h))}</th>`).join('')}</tr></thead><tbody>${s.table.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(tr(c))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}${s.bullets?`<ul class="takeaways">${s.bullets.map(b=>`<li>${esc(tr(b))}</li>`).join('')}</ul>`:''}${s.notes?notesUI():''}</section>`).join('');
 $('language').textContent=text('中文','English');$('present').textContent=document.body.classList.contains('present')?text('Exit presentation','退出演示'):text('Present','演示模式');$('print').textContent=text('Print / PDF','打印／PDF');
 $('side-label').textContent=text('Team working brief','团队工作简报');$('snapshot').textContent=D.snapshot;
 $('side-meta').innerHTML=text('<strong>Current stage</strong><br>Business validation + MVP exploration<br><br>Human-reviewed records first. AI helps retrieve and organise.','<strong>当前阶段</strong><br>业务验证与 MVP 探索<br><br>以人工核对的记录为准，AI 帮助查找和整理。');
 $('search').placeholder=text('Find a topic…','快速查找…');$('search').setAttribute('aria-label',text('Search this brief','搜索简报'));
 $('sources-label').textContent=text('Sources & evidence boundaries','来源与证据边界');
 $('source-list').innerHTML=D.sources.map(s=>`<article><span class="kind">${esc(s.id)} · ${esc(s.kind)}</span><h3>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`:esc(s.name)}</h3><p>${esc(s.detail)}</p></article>`).join('')+D.research.map(r=>`<article><span class="kind">${text('Workflow research','记录方式调研')}</span><h3><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a></h3><p>${esc(r.finding)}</p></article>`).join('');
 $('previous').textContent=text('Previous','上一页');$('next').textContent=text('Next','下一页');$('page-count').textContent=`${current+1} / ${D.sections.length} · ${tr(D.sections[current].nav)}`;
 $('previous').disabled=current===0;$('next').disabled=current===D.sections.length-1;
 $('footnote').textContent=text('Snapshot, not approved requirements. Arrow keys: sections · P: presentation · Print includes every section. Offline notes do not synchronise automatically.','本页是当前快照，不是已确认需求。方向键切换页面，P 切换演示模式，打印包含全部页面。本地笔记不会自动同步。');
 document.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>navigate(Number(b.dataset.section))));
 document.querySelectorAll('[data-note]').forEach(el=>el.addEventListener('input',()=>{notes[el.dataset.note]=el.value;try{localStorage.setItem(NOTE_KEY,JSON.stringify(notes));$('save-state').textContent=text('Saved locally · export to share','已在本地保存，导出后共享')}catch(e){$('save-state').textContent=text('Local saving unavailable · export before closing','本地保存不可用，关闭前请导出')}}));
 if($('export-notes'))$('export-notes').addEventListener('click',exportNotes);
}
function navigate(index){if(index<0||index>=D.sections.length)return;current=index;render();try{history.replaceState(null,'','#'+D.sections[current].id)}catch(e){}$('search-results').hidden=true;window.scrollTo({top:0,behavior:'instant'})}
function exportNotes(){const md=`# Project Nucleon — meeting notes\n\nMeeting: 15 October 2026, 20:30 Australia/Sydney.\nExported: ${new Date().toISOString()} (UTC).\nStatus: local capture; review before treating as confirmed decisions.\n\n## First request scenario\n${notes.scenario||'(Not recorded)'}\n\n## Owner work removed / new work introduced\n${notes.removed||'(Not recorded)'}\n\n## Benefit test and next actions\n${notes.validation||'(Not recorded)'}\n\nAfter review, update the dated meeting file, decision log and current state in GitHub. This export has not been uploaded automatically.\n`;const url=URL.createObjectURL(new Blob([md],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='nucleon-meeting-notes-2026-10-15.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function togglePresent(){document.body.classList.toggle('present');$('present').setAttribute('aria-pressed',String(document.body.classList.contains('present')));render()}
function runSearch(){const query=$('search').value.trim().toLowerCase();if(!query){$('search-results').hidden=true;return}const hits=D.sections.map((s,i)=>({s,i})).filter(({s})=>JSON.stringify(s).toLowerCase().includes(query));$('search-results').innerHTML=hits.length?hits.map(({s,i})=>`<button type="button" data-hit="${i}">${esc(tr(s.nav))} · ${esc(tr(s.title))}</button>`).join(''):`<p>${text('No matching section','没有匹配页面')}</p>`;$('search-results').hidden=false;document.querySelectorAll('[data-hit]').forEach(b=>b.addEventListener('click',()=>{navigate(Number(b.dataset.hit));$('search').value=''}))}
const initial=D.sections.findIndex(s=>s.id===location.hash.slice(1));if(initial>=0)current=initial;
$('language').addEventListener('click',()=>{lang=lang==='en'?'zh':'en';render();$('search-results').hidden=true});$('present').addEventListener('click',togglePresent);$('print').addEventListener('click',()=>window.print());$('previous').addEventListener('click',()=>navigate(current-1));$('next').addEventListener('click',()=>navigate(current+1));$('search').addEventListener('input',runSearch);
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='ArrowRight'){e.preventDefault();navigate(current+1)}else if(e.key==='ArrowLeft'){e.preventDefault();navigate(current-1)}else if(e.key.toLowerCase()==='p'){e.preventDefault();togglePresent()}else if(e.key==='Escape'&&document.body.classList.contains('present'))togglePresent()});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))$('search-results').hidden=true});
window.addEventListener('beforeprint',()=>{$('sources').open=true});render();
</script>
</body>
</html>
